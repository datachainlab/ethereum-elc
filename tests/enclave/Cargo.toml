[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "proxy_enclave"
crate-type = ["staticlib"]

[dependencies]
# TEMPORARY: datachainlab/lcp#150 (cargo sgx build); the commit is only on the
# fork until it merges.
enclave-runtime = { git = "https://github.com/yoshidan/lcp", rev = "4c911e010261bb2f6f10c75b82e2c43412421a5e" }
tendermint-lc = { git = "https://github.com/yoshidan/lcp", rev = "4c911e010261bb2f6f10c75b82e2c43412421a5e", default-features = false }
ethereum-elc = { path = "../../light-client", default-features = false }

[build-dependencies]
sgx-build = { tag = "v0.1.0", git = "https://github.com/datachainlab/sgx-sdk-rs" }

# ssz-rs declares thiserror 1.x unconditionally, which needs std.
[patch."https://github.com/bluele/ssz_rs"]
ssz-rs = { git = "https://github.com/yoshidan/ssz_rs", branch = "remove-unused-thiserror" }
ssz-rs-derive = { git = "https://github.com/yoshidan/ssz_rs", branch = "remove-unused-thiserror" }

[patch."crates-io"]
ibc = { git = "https://github.com/datachainlab/ibc-rs", rev = "v0.29.0-channel-upgrade-path" }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
