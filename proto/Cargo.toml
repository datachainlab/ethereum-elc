[package]
name         = "ethereum-elc-proto"
edition      = "2021"
version      = "0.1.0"

[lib]
name = "ethereum_elc_proto"
path = "src/lib.rs"
doctest = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost       = { version = "0.11", default-features = false }
ibc-proto   = { version = "0.26.0", default-features = false }
ethereum-light-client-proto = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev = "v0.3.0-rc9", default-features = false }

[features]
default = ["std"]
std     = []
