[package]
name = "ethereum-elc"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = { version = "0.11.9", default-features = false }
serde = { version = "1.0.186", default-features = false, features = ["derive", "alloc"] }
bytes = { version = "1.4.0", default-features = false }
time = { version = "0.3.17", default-features = false }
thiserror = { version = "2.0", default-features = false }
ethereum-elc-proto = { path = "../proto", default-features = false}

# ethereum-light-client-rs
ethereum-consensus = { git = "https://github.com/datachainlab/ethereum-light-client-rs", rev = "v0.3.0", default-features = false }
ethereum-light-client-verifier = { git = "https://github.com/datachainlab/ethereum-light-client-rs", rev = "v0.3.0", default-features = false }

# ethereum-light-client-types
ethereum-light-client-proto = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev = "v0.3.0-rc9", default-features = false }
ethereum-light-client-types = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev = "v0.3.0-rc9", default-features = false }

# LCP
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc"] }

[dev-dependencies]
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc", "std"] }
store = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false }

hex-literal = "0.4.1"
ethereum-consensus = { git = "https://github.com/datachainlab/ethereum-light-client-rs", rev = "v0.3.0", default-features = false, features = ["prover"] }
ethereum-light-client-verifier = { git = "https://github.com/datachainlab/ethereum-light-client-rs", rev = "v0.3.0", default-features = false, features = ["test-utils"] }
